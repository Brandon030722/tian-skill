<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在折光航线的三个可操作示例中比较 Tian 控件的三个深度。">
  <title>Tian · 控件交互深度</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #efeee8;
      --ink: #152322;
      --muted: #435452;
      --rule: #acb4aa;
      --accent: #254a44;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    h1, h2, p { margin: 0; }
    .wrap { width: min(100% - 2.5rem, 80rem); margin-inline: auto; }
    .brand {
      padding-block: 1.05rem;
      border-bottom: 1px solid var(--rule);
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 850;
      letter-spacing: .035em;
    }

    main { padding-block: clamp(2.2rem, 5.4vw, 5.3rem); }
    h1 { font-size: clamp(2.75rem, 6.6vw, 6rem); letter-spacing: -.085em; line-height: 1.04; }
    .intro {
      max-width: 35rem;
      margin-block: 1rem clamp(2rem, 5.5vw, 4.2rem);
      font-size: clamp(1rem, 1.45vw, 1.25rem);
      line-height: 1.7;
      color: var(--muted);
    }

    .examples {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(1rem, 2.25vw, 2rem);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-top: 1px solid var(--accent);
    }

    .card h2 {
      display: flex;
      align-items: baseline;
      gap: .7rem;
      padding-block: .9rem 1rem;
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      letter-spacing: -.04em;
    }

    .card h2 span {
      font-size: .82rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    .preview {
      display: block;
      box-shadow: 0 0 0 1px #27363539;
      width: 100%;
      height: auto;
      aspect-ratio: 8 / 5;
      object-fit: cover;
      object-position: center top;
      background: #142223;
    }

    .contents { display: flex; flex: 1; align-items: flex-start; flex-direction: column; gap: .75rem; padding-block: 1rem .2rem; }
    .contents p { color: var(--muted); line-height: 1.65; }
    .open-demo {
      display: inline-flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      min-height: 44px;
      padding: .55rem .85rem;
      margin-top: auto;
      border: 1px solid var(--accent);
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
      transition: background-color 150ms, color 150ms, transform 120ms;
    }

    .open-demo:active { transform: scale(.98); }
    .open-demo:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    @media (hover: hover) {
      .open-demo:hover { background: var(--accent); color: var(--paper); }
    }

    @media (max-width: 830px) {
      .examples { grid-template-columns: minmax(0, 1fr); gap: 2rem; }
      .card { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); column-gap: 1rem; }
      .card h2 { grid-column: 1 / -1; }
      .contents { padding-top: 0; }
    }

    @media (max-width: 520px) {
      .card { display: flex; }
      .contents { padding-top: .85rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .open-demo { transition: none; }
      .open-demo:active { transform: none; }
    }
  </style>
</head>
<body>
  <header class="wrap brand">Tian</header>
  <main class="wrap">
    <h1>控件交互深度</h1>
    <p class="intro">从一个动作的即时反馈，到参数联动，再到整段任务。三个示例都可以直接操作。</p>

    <ol class="examples" aria-label="三个交互示例">
      <li class="card">
        <h2><span>01</span>基础反馈</h2>
        <img class="preview" src="depth-1.jpg" width="768" height="480" alt="">
        <div class="contents">
          <p>《折光航线》发布站。切换场景、播放预告，或体验按钮的等待与结果反馈。</p>
          <a class="open-demo" href="../showcase/index.html">打开发布站 <span aria-hidden="true">→</span></a>
        </div>
      </li>
      <li class="card">
        <h2><span>02</span>组件联动</h2>
        <img class="preview" src="depth-2.jpg" width="768" height="480" alt="">
        <div class="contents">
          <p>展开选中的频段，联动回波图与读数。扫描可以启动、取消或重跑。</p>
          <a class="open-demo" href="../depth-2/index.html">试回波校准 <span aria-hidden="true">→</span></a>
        </div>
      </li>
      <li class="card">
        <h2><span>03</span>任务流程</h2>
        <img class="preview" src="depth-3.jpg" width="768" height="480" alt="">
        <div class="contents">
          <p>展开航线场景，看水光、海雾和灯束如何入场，再按航线要求装配设备。</p>
          <a class="open-demo" href="../depth-3/index.html">试航线调度 <span aria-hidden="true">→</span></a>
        </div>
      </li>
    </ol>
  </main>
</body>
</html>
